name: Deploy

# Publishes apps/web/dist to Cloudflare Pages. The COOP/COEP and caching headers come from
# apps/web/public/_headers, which Vite copies into dist.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secrets.CLOUDFLARE_API_TOKEN   — API token with the "Cloudflare Pages — Edit" permission
#   secrets.CLOUDFLARE_ACCOUNT_ID  — the account id shown in the Cloudflare dashboard
#   vars.CLOUDFLARE_PAGES_PROJECT  — the Pages project name (created once in the dashboard)
# The job is skipped, not failed, until the project name variable is set.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build · deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same gates as CI so a red main never deploys.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-dirty=true
